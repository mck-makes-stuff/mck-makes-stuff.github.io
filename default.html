<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="masthead">
  <a class="wordmark" href="{{ '/' | relative_url }}">Gail McKinney</a>
  <nav aria-label="Primary">
    {% for item in site.nav %}
      <a href="{{ item.url | relative_url }}"
         {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
    {% endfor %}
  </nav>
</header>

<main id="main">
  {{ content }}
</main>

<footer class="footer">
  <div class="footer-inner">
    <p class="footer-name">Gail McKinney</p>
    <ul class="footer-links">
      <li><a href="mailto:{{ site.email }}">Email</a></li>
      <li><a href="https://github.com/{{ site.github_username }}">GitHub</a></li>
    </ul>
  </div>
</footer>

</body>
</html>
