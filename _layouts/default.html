<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="theme-color" content="#F2EFE9">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Caveat+Brush&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="masthead">
  <a class="wordmark" href="{{ '/' | relative_url }}">
    <span class="wordmark-mark" aria-hidden="true"><span class="mark-text">M<i>c</i>K</span></span>
    <span class="wordmark-name">Gail McKinney</span>
  </a>
  <nav aria-label="Primary">
    {% for item in site.nav %}
      <a href="{{ item.url | relative_url }}"
         {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
    {% endfor %}
  </nav>
</header>

<main id="main">
  {{ content }}
</main>

<footer class="footer">
  <div class="footer-inner">
    <p class="footer-name">Gail McKinney</p>
    <ul class="footer-links">
      <li><a href="mailto:{{ site.email }}">Email</a></li>
      <li><a href="https://github.com/{{ site.github_username }}">GitHub</a></li>
    </ul>
  </div>
</footer>

</body>
</html>
