---
layout: default
title: Education
permalink: /education/
---

<div class="wrap">
  <section class="section">
    <p class="eyebrow">Education</p>

    {% for school in site.data.education %}
      <div class="entry" id="{{ school.org | slugify }}">
        <h3>{{ school.org }}</h3>
        <p class="role">{{ school.role }}</p>
        <p class="meta">{{ school.dates }}</p>
        <ul>
          {% for point in school.points %}<li>{{ point }}</li>{% endfor %}
        </ul>
      </div>
    {% endfor %}
  </section>
</div>
