- name: Crash Cash
  meta: Personal project · 2026
  summary: >-
    A browser-based sandbox for learning personal finance through simulation. Take a job,
    open accounts, run up a credit card, file taxes, and watch what happens. It is designed 
    to be a teaching tool for people who have limited access to financial education, 
    and to be a safe space to make mistakes and learn from them.
  points:
    - Implemented 2025 federal tax brackets, FICA with the wage cap, a FICO-style score built from the published factor weights, and interest-first amortization on four kinds of debt.
    - Built the simulation engine as pure JavaScript with no dependencies, covered by unit tests in Node and pytest.
    - Documented the modeling simplifications in-app and in a public GitHub repository.
  tags: [JavaScript, Simulation, Unit testing, Agentic coding]
  links:
    - text: Live site
      url: https://mck-makes-stuff.github.io/crash-cash/
    - text: Source
      url: https://github.com/mck-makes-stuff/crash-cash

- name: Madeira Course Catalog
  meta: The Madeira School · 2026
  summary: >-
    A course planning app for students building a four-year academic plan.
    Browse the catalog, drag courses into grade year columns, and watch
    distribution and block requirements fill in as you go.
  points:
    - Worked with the school's academic office as stakeholders across several rounds of iteration, incorporating their feedback on course data, requirement logic, and planning workflow.
    - Handled the edge cases of the catalog: locked courses that auto-populate by entry year, seasonal athletic blocks with multiple selections, and live block and credit counters.
    - Coded by hand with HTML, CSS, and JavaScript, with plan state persisted in the browser.
  tags: [JavaScript, Interface design, Stakeholder work]
  links:
    - text: Live site
      url: https://mck-makes-stuff.github.io/mad-courses/
    - text: Source
      url: https://github.com/mck-makes-stuff/mad-courses

- name: Object Detection for Autonomous Driving
  meta: Inspirit AI Scholars · 2025
  summary: >-
    A five-model comparison for autonomous driving perception, presented as a
    review show so a mixed audience of students, parents, and instructors could
    follow the tradeoffs.
  points:
    - In Google CoLab notebooks, implemented and evaluated five object detection approaches in Python on large datasets of images.
    - Worked up from a perceptron baseline through sliding windows, a convolutional network built from scratch in PyTorch, VGG16 with transfer learning, and YOLO.
    - Evaluated each approach on accuracy, overfitting behavior, and real-time viability.
    - Completed the capstone independently after group attrition; presented the results live to the cohort, guests, and instructors.
  tags: [Python,PyTorch, Computer vision, Model evaluation]
  links:
    - text: Presentation
      url: https://www.youtube.com/watch?v=37J1svFGk9U

